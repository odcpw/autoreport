name: AutoBericht skill package
on:
  pull_request:
    paths:
      - 'skills/autobericht/**'
      - 'dist/autobericht/**'
      - 'autobericht-skill.zip'
      - 'docs/autobericht/AutoBericht_portable.md'
      - '.github/workflows/autobericht-skill-package.yml'
  push:
    branches: [main]
    paths:
      - 'skills/autobericht/**'
      - 'dist/autobericht/**'
      - 'autobericht-skill.zip'
      - 'docs/autobericht/AutoBericht_portable.md'
      - '.github/workflows/autobericht-skill-package.yml'
permissions:
  contents: read
jobs:
  check-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portable helper behaviour
        run: python3 -m unittest discover -s skills/autobericht/scripts -p 'test_*.py'
      - name: Rebuild upload files from editable skill
        run: python3 skills/autobericht/scripts/build_distribution.py
      - name: Reject stale distribution files
        run: |
          git diff --exit-code -- autobericht-skill.zip dist/autobericht docs/autobericht/AutoBericht_portable.md
          test -z "$(git ls-files --others --exclude-standard -- autobericht-skill.zip dist/autobericht)"
